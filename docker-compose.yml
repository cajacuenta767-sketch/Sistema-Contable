services:
  db:
    image: postgres:16-alpine
    container_name: sistema-contable-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contable
      POSTGRES_PASSWORD: contable
      POSTGRES_DB: sistema_contable
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contable -d sistema_contable']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
